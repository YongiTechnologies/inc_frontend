# Proxy the API to the backend's own Netlify site. The browser only ever talks
# to this domain, so the refresh cookie is first-party (Safari blocks the
# cross-site kind). Change the host if the backend site gets another name.
[[redirects]]
  from = "/api/*"
  to = "https://clinette-backend.netlify.app/api/:splat"
  status = 200
  force = true
